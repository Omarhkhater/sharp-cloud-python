[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-cocoro-air"
version = "0.3.0"
description = "Home Assistant integration for Sharp air conditioners on the Sharp Egypt cloud"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Omar Khater" }
]

[project.optional-dependencies]
dev = [
    "aiohttp",
    "homeassistant>=2025.1.0",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = []
